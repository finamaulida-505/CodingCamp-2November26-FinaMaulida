<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p id="date" class="date"></p>
        <p id="clock" class="clock">--:--</p>
        <p class="greeting"><span id="greeting-text">Hello</span><span id="greeting-name"></span></p>
        <label class="name-field">
          <span>Your name</span>
          <input id="name-input" type="text" maxlength="24" placeholder="Type your name" autocomplete="given-name">
        </label>
      </div>
      <button id="theme-toggle" class="btn ghost" type="button" aria-label="Switch theme">Dark mode</button>
    </header>

    <section class="card timer" aria-labelledby="timer-title">
      <h2 id="timer-title">Focus timer</h2>
      <p id="timer-display" class="timer-display" aria-live="off">25:00</p>
      <p id="timer-status" class="muted" aria-live="polite">Ready to focus for 25 minutes.</p>
      <div class="row">
        <button id="timer-start" class="btn primary" type="button">Start</button>
        <button id="timer-stop" class="btn" type="button">Stop</button>
        <button id="timer-reset" class="btn" type="button">Reset</button>
      </div>
    </section>

    <section class="card todo" aria-labelledby="todo-title">
      <h2 id="todo-title">To-do list</h2>
      <div class="row add-row">
        <input id="task-input" type="text" maxlength="120" placeholder="What do you need to do?" aria-label="New task">
        <button id="task-add" class="btn primary" type="button">Add task</button>
      </div>
      <p id="task-message" class="message" role="alert"></p>
      <ul id="task-list" class="task-list"></ul>
      <p id="task-empty" class="muted empty">No tasks yet. Add your first one above.</p>
    </section>

    <section class="card links" aria-labelledby="links-title">
      <h2 id="links-title">Quick links</h2>
      <div id="link-list" class="link-list"></div>
      <div class="row link-form">
        <input id="link-name" type="text" maxlength="20" placeholder="Name" aria-label="Link name">
        <input id="link-url" type="text" placeholder="example.com" aria-label="Link address">
        <button id="link-add" class="btn" type="button">Add link</button>
      </div>
      <p id="link-message" class="message" role="alert"></p>
    </section>
  </main>
</body>
</html>
